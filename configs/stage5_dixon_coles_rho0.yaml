# Controle negatif du scenario Dixon-Coles (configs/stage5_dixon_coles.yaml) :
# IDENTIQUE en tout point (meme seed, meme taille, meme structure de
# marche) sauf dixon_coles_rho=0.0 - aucune correlation basse-score
# reellement injectee. Sur le meme principe que les controles negatifs
# E1/E7 (docs/research_framework.md section E, football_model/negative_controls.py) :
# DixonColesModel ne doit PAS ameliorer significativement sur poisson_simple
# quand rho=0 est vraiment nul, sans quoi le pipeline de test lui-meme
# (protocole, metriques, ou generateur) serait suspect.

synthetic_data:
  seed: 2024
  n_teams: 14
  n_matches: 3000
  start_date: "2021-08-01T00:00:00+00:00"
  days_between_matches: 1.0
  result_confirmation_delay_hours: 2.0
  fixture_announcement_days_before: 14.0
  odds_snapshot_offsets_hours: [72.0, 24.0, 1.0]
  team_attack_log_std: 0.35
  team_defense_log_std: 0.35
  market_margin: 0.05
  market_noise_concentration: 40.0
  dixon_coles_rho: 0.0

decision_offset_hours_before_kickoff: 2.0
