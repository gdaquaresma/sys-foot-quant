[project]
name = "sys-foot-quant"
version = "0.1.0"
description = "Laboratoire quantitatif falsifiable pour l'analyse et la selection de paris football."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sys_foot_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
